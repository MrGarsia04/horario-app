<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B2430" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Horarios" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Panel de Horarios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Aplica el tema guardado ANTES de pintar, para que no haya un parpadeo oscuro
         al abrir la app en modo rosa. (La lógica completa está en src/lib/theme.js) -->
    <script>
      try {
        if (localStorage.getItem('horario-app-theme') === 'rosa') {
          document.documentElement.setAttribute('data-theme', 'rosa')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FFF0F5')
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-board-bg">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
